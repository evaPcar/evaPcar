<title>Recetario Pacheco</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Amatic+SC:wght@700&family=Kalam:wght@300;400;700&display=swap">
<style>
/* Layout: the user's own hand-drawn A5 design, rebuilt; every recipe flows onto as many A5 pages as it needs, measured against her mojito page. Single paper look by choice. */
:root{
  --desk:#3a2c22; --paper:#fcfbf7; --ink:#1a1a1a; --soft:#5d554c; --note:#f1e2c4; --warn:#fbe3c8;
  --f-title:"Yellowtail","Brush Script MT",cursive;
  --f-body:"Kalam","Segoe Print","Comic Sans MS",cursive;
  --f-quote:"Amatic SC","Arial Narrow",sans-serif;
  --fs:3.2; color-scheme:dark;
}
body{background:var(--desk);color:var(--note);font-family:var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 60px}
.wrap{width:100%;max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
header{text-align:center}
header h1{font-family:var(--f-title);font-weight:400;font-size:clamp(2.6rem,8vw,4.2rem);margin:0;line-height:1}
header p{margin:.5rem auto 0;color:#dccbad;max-width:62ch;line-height:1.5}
.summary{background:rgba(241,226,196,.07);border:1px solid rgba(241,226,196,.2);border-radius:8px;padding:12px 16px;overflow-x:auto}
.summary table{border-collapse:collapse;width:100%;font-size:.98rem}
.summary th,.summary td{text-align:left;padding:5px 10px;border-bottom:1px solid rgba(241,226,196,.14)}
.summary th{font-weight:700;color:var(--note)}
.summary td.n{font-variant-numeric:tabular-nums}
.summary a{color:var(--note)}
.chip{display:inline-block;border-radius:999px;padding:0 9px;font-size:.85rem;border:1px solid rgba(241,226,196,.4)}
.chip.two{background:rgba(241,226,196,.18)}.chip.three{background:var(--note);color:var(--desk)}

article{display:flex;flex-direction:column;gap:12px;scroll-margin-top:16px}
article>h2{font-family:var(--f-title);font-weight:400;font-size:2.1rem;margin:12px 0 0;line-height:1;color:var(--note)}
.pages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:760px){.pages{grid-template-columns:1fr}}
.pgw{container-type:inline-size;min-width:0;display:flex;flex-direction:column;gap:6px}
.pglabel{font-size:.9rem;color:#cdbb9c;text-align:center}
.side{display:flex;flex-direction:column;gap:8px}
.warn{background:var(--warn);border-radius:6px;padding:8px 12px;font-size:.95rem;color:#5a2a12}
.warn b{font-weight:700}
.done{display:flex;align-items:center;gap:8px;font-size:.95rem;color:var(--note);cursor:pointer;align-self:flex-end}
.done input:focus-visible{outline:2px solid var(--note);outline-offset:2px}
article.is-done .sheet{opacity:.65}

/* ---------- the A5 sheet ---------- */
.sheet{box-sizing:border-box;position:relative;width:100%;height:calc(100cqw * 210 / 148);font-size:calc(var(--fs) * 1cqw);
  background:var(--paper);color:var(--ink);font-family:var(--f-body);line-height:1.38;
  padding:13cqw 12.5cqw 11.5cqw;display:flex;flex-direction:column;gap:.3em;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.fr{position:absolute;inset:8cqw 7.5cqw;border:.5cqw solid var(--ink);pointer-events:none}
.fr::after{content:"";position:absolute;inset:.8cqw;border:.18cqw solid var(--ink)}
.hd{position:absolute;top:8.25cqw;left:50%;transform:translate(-50%,-50%);background:var(--paper);padding:0 1.4cqw;display:flex;align-items:center;gap:.8cqw;
  font-size:2.6cqw;letter-spacing:.14em;white-space:nowrap;line-height:1}
.hd svg{width:4cqw;height:4cqw;flex:none}
.cn{position:absolute;width:5cqw;height:5cqw;pointer-events:none}
.deco{position:absolute;pointer-events:none}

.top{display:grid;grid-template-columns:38% minmax(0,1fr);gap:.4em;min-height:30cqw}
.cl{position:relative;min-height:30cqw}
.cl svg{position:absolute}
.tw{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1em;min-width:0}
.tw h3{font-family:var(--f-title);font-weight:400;font-size:2.75em;line-height:.95;margin:0;text-align:center;text-wrap:balance}
.tm{font-size:.82em;text-align:center;margin:-.2em 0 0}
.rb{display:block;width:100%;max-width:19em;aspect-ratio:200/50;margin-top:-.15em}
.mid{display:grid;grid-template-columns:minmax(0,1fr) 46%;gap:.5em;align-items:start}
.hero{position:relative;aspect-ratio:1;width:100%}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.sheet h4{font-weight:700;font-size:1.06em;margin:.25em 0 0;letter-spacing:.03em;text-transform:uppercase;line-height:1.2}
ul.ing{list-style:none;margin:0;padding:0}
ul.ing li{padding-left:.75em;text-indent:-.75em}
ul.ing li::before{content:"• "}
ul.ing li.sub{font-weight:700;padding-left:0;text-indent:0;break-after:avoid}
ul.ing li.sub::before{content:none}
ol.st{margin:0;padding-left:1.6em}
ol.st li{margin-bottom:.2em}
ol.st li::marker{font-weight:700}
.fq{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:.4em;text-align:center;font-family:var(--f-quote);font-weight:700;font-size:1.75em;line-height:1.02}
.fq svg{width:1.2em;height:1.2em;flex:none}
.sheet.cpt .mid{grid-template-columns:minmax(0,1fr) 30%}
.sheet.cpt .top,.sheet.cpt .cl{min-height:24cqw}
.sheet.cpt .cl svg:nth-child(5),.sheet.cpt .cl svg:nth-child(8),.sheet.cpt .cl svg:nth-child(11){display:none}
.endb{margin-top:auto;display:flex;flex-direction:column;gap:.3em}
.tk{font-size:.85em;padding:0 1.6em}
.sg{margin-top:auto;text-align:right;font-size:.95em;padding-right:1.6em}
.ct{text-align:center;margin-top:.4em}
.h4c{margin-top:1.6em!important}
ul.ing.two{columns:2;column-gap:1.2em}
ul.ing.two li{break-inside:avoid}
.herobig{flex:1;min-height:0;position:relative;margin-top:.4em}
.herobig svg{position:absolute;inset:0;width:100%;height:100%}
.ct h3{font-family:var(--f-title);font-weight:400;font-size:2em;line-height:1;margin:0}
.ct span{font-size:.9em}
.sheet.idx{font-size:calc(var(--fs) * .44cqw)}
.idx h3{font-family:var(--f-title);font-weight:400;font-size:3em;text-align:center;margin:.2em 0 .1em;line-height:1}
.idx .chap{font-weight:700;text-transform:uppercase;font-size:.95em;margin-top:.35em}
.idx a{display:flex;gap:.35em;color:var(--ink);text-decoration:none;font-size:.92em}
.idx a .dots{flex:1;border-bottom:.08em dotted var(--ink);transform:translateY(-.3em);min-width:1em}
.idx a:hover .t{text-decoration:underline}
#meas{position:absolute;left:-10000px;top:0;width:520px}
</style>

<script>
const R=[
{id:"sandwich",chap:"Para picar",t:"Sándwich de Huevo Japonés",who:"Eva",time:"20 min",dd:["egg","mayo","salt","bread","d-fork"],
 ing:["4 huevos","3 cucharadas de mayonesa","½ cucharada de azúcar","1 cucharada de vinagre","Sal y pimienta","Pan de molde blando"],
 prep:["Cuece los huevos 10 minutos, enfríalos y pélalos.","Chafa las yemas con la mayonesa, el azúcar, el vinagre, sal y pimienta.","Pica las claras muy pequeñitas y mézclalas con la crema.","Rellena el pan bien gordito, quita la corteza y corta por la mitad."],
 quote:"¿Qué fue primero, el huevo o el sándwich?"},
{id:"croquetas",chap:"Para picar",t:"Croquetas de Gambas sin Gluten",who:"Eva",time:"1 h + 1 noche",dd:["shrimp","croqueta","milk","egg","d-whisk"],
 ing:["300 g de gambas","½ cebolla","70 g de mantequilla","80 g de harina sin gluten","700 ml de leche","Nuez moscada y sal","2 huevos","Pan rallado sin gluten","Aceite para freír"],
 prep:["Pica las gambas, saltéalas 1 minuto y resérvalas.","Pocha la cebolla muy fina en la mantequilla, añade la harina y tuéstala 2 minutos.","Echa la leche caliente poco a poco sin dejar de remover, unos 15 minutos, hasta que la bechamel quede medio resistente: que se despegue de las paredes.","Añade sal, nuez moscada y las gambas. Tápala con film pegado y a la nevera toda la noche.","Forma las croquetas, pásalas por huevo y pan rallado y fríelas en aceite bien caliente, pocas cada vez."],
 quote:"Camarón que se duerme… se convierte en croqueta"},
{id:"fondue",chap:"Para picar",t:"Fondue en Pan",who:"Toñi",time:"45 min",dd:["bread","cheese","onion","mayo","d-spoon"],
 ing:["1 pan de payés de 1 kg","160 g de Emmental rallado","160 g de queso curado en polvo","175 g de cebolleta","175 g de mayonesa","Pimienta negra","Cebollino picado"],
 prep:["Corta la tapa del pan y vacíalo. Guarda la miga en trozos para mojar.","Mezcla los quesos, la cebolleta picada, la mayonesa y la pimienta.","Rellena el pan, ponle la tapa y envuélvelo en papel de aluminio.","Al horno a 180 °C unos 25 minutos. Quita el aluminio y 5 minutos más para que se tueste.","Cebollino por encima… ¡y a mojar!"],
 quote:"Aquí el plato también se come"},
{id:"hojaldre",chap:"Para picar",t:"Hojaldre de Verduras y Atún",who:"Toñi",time:"40 min",dd:["eggplant","mushroom","zucchini","pepper","tuna"],
 ing:["1 lámina de hojaldre","½ berenjena","150 g de champiñones","½ calabacín","½ pimiento","½ cebolla (opcional)","1 lata de atún","Queso rallado","Queso de cabra","Anchoas","Aceite"],
 prep:["Pincha el hojaldre con un tenedor y hornéalo 10 minutos a 200 °C.","Saltea las verduras troceadas con media cucharada de aceite.","Ponlas sobre el hojaldre con el atún y el queso rallado, y al horno 10-15 minutos hasta que gratine.","Al sacarlo, el queso de cabra y las anchoas: el truco de la Toñi."],
 quote:"Capas y capas, como una buena familia"},
{id:"hojceps",chap:"Para picar",t:"Hojaldre de Ceps y Foie",who:"Carla",book:"Recetario Pacheco López",hero:"hojaldre",time:"25 min",dd:["mushroom","onion","d-leaf","oil","d-fork"],
 ing:["1 lámina de hojaldre (Mercadona)","Ceps en láminas finitas (los que traiga Manolo)","Cebolla caramelizada","Foie","Sal y pimienta","Un poco de aceite muy bueno"],
 prep:["Abre el hojaldre y, sobre su mismo papel, pínchalo.","Al horno fuerte (190-200 °C), vigilándolo, hasta que esté bien tostado, no solo blanco, pero sin que se queme.","Sácalo y pon la cebolla caramelizada y las láminas de ceps.","Sal, pimienta y un poquito de aceite muy bueno.","Al horno otra vez, menos de 5 min: la cebolla ya está hecha.","Al sacarlo, el foie: en taquitos si tienes mucho, rallado si tienes poco."],
 quote:"El hojaldre no espera a nadie",truco:"Se come en el momento: recalentado ya no está igual."},
{id:"torreznos",chap:"Para picar",t:"Torreznos de Soria",who:"Raquel",book:"Recetario Pacheco Carnicero",time:"45 min",dd:["bacon","salt","pan","d-fork","d-leaf"],
 ing:["Torreznos de Soria","Sal"],
 prep:["Corta los torreznos en tiras.","A la sartén a fuego lento, en su propia grasa.","Desgrasa: ve quitando la grasa que suelten.","Sube el fuego al final para que la corteza quede crujiente.","Escúrrelos en papel de cocina y sírvelos calientes con sal."],
 quote:"De Soria, con gloria",warn:"Confirmar con Raquel tiempos y si les hace algo más."},
{id:"morros",chap:"Para picar",t:"Morros de Soria",who:"Raquel",book:"Recetario Pacheco Carnicero",time:"20 min",dd:["pan","salt","chili","d-fork","d-leaf"],
 ing:["Morro de cerdo cocido","Sal","Pimentón (opcional)"],
 prep:["Corta el morro en trozos.","A la sartén o la plancha, a fuego medio, hasta que se doren y queden crujientes.","Desgrasa: escúrrelos bien en papel de cocina.","Sal y un poco de pimentón por encima, y a la mesa calentitos."],
 quote:"¡Para chuparse los morros!",warn:"Confirmar con Raquel cómo hace los morros (cocidos y a la plancha, rebozados, en salsa…)."},
{id:"salmon",chap:"Para picar",t:"Salmón Marinado",who:"Raquel",time:"20 min + 2 días",dd:["d-leaf","lemon","salt","sugar","d-fork"],
 ing:["Lomos de salmón (1-1,5 kg)","Sal: el mismo peso que el salmón","Azúcar: el mismo peso que el salmón","Bastante eneldo","Papel film","Papel secante y de horno"],
 prep:["Pide en la pescadería que te corten el salmón a lomos.","Mezcla en un bol la sal y el azúcar con bastante eneldo.","En un recipiente alto pon una capa de mezcla, el salmón y otra capa encima. Si hay dos trozos, como una lasaña.","Un poco más de eneldo por encima, tapa con film y a la nevera al menos 48 h (puede estar hasta 3 días).","Sácalo, lávalo bajo el grifo para quitarle la sal y el azúcar, y sécalo muy bien con papel.","Envuélvelo en papel secante y papel de horno, y a la nevera un par de días: cuanto más seco, más bueno. También se puede congelar.","Córtalo muy fino ¡y listo!"],
 quote:"No tiene ningún secreto… solo paciencia",truco:"¡Suelta mucha agua! Usa un recipiente alto."},
{id:"huevos",chap:"Para picar",t:"Huevos Rellenos",who:"Raquel",time:"30 min",dd:["egg","tuna","mayo","d-leaf","d-spoon"],
 ing:["12 huevos","2 latas de atún","½ bolsa de palitos de cangrejo (bonÀrea)","Mayonesa Kraft","Eneldo (o perejil seco)"],
 prep:["Cuece los huevos, enfríalos, pélalos y córtalos por la mitad.","Escurre el atún y ponlo en un bol con los palitos de cangrejo cortados muy pequeñitos.","Añade la mayonesa Kraft y solo un par de yemas, y mézclalo todo.","Rellena los huevos con una cucharita.","Por encima, una yema rota para decorar y un poco de eneldo."],
 quote:"Se hacen para compartir… y ahí es donde triunfan",truco:"Las yemas que sobran, para el Brook."},
{id:"hummus",chap:"Para picar",t:"Hummus",who:"Lorena",time:"15 min",dd:["d-bowl","carrot","oil","d-spoon","d-leaf"],
 ing:["1 bote de garbanzos cocidos","2 cucharadas de aceite","½ cucharada de vinagre","Un chorrito de agua","Sésamo tostado","1 diente de ajo","Pimentón y comino","Sal","Para mojar: zanahoria, palitos o apio"],
 prep:["Lava muy bien los garbanzos y pélalos: así pierden el gusto a bote.","Ponlos en un bol con el aceite, el vinagre y un chorrito de agua, lo justo para que la batidora pueda batir.","Tritura el sésamo tostado en el molinillo: será tu tahini.","Pica el ajo muy fino, quitándole el centro para que no pique.","Añade el sésamo, el ajo, el pimentón y el comino, y bátelo todo.","Ajusta de sal, aceite y vinagre a tu gusto.","Por encima, un poco de pimentón y sésamo. Sírvelo con palitos de zanahoria."],
 quote:"Sano, rico… y para mojar",truco:"El original lleva tahini: con sésamo tostado triturado queda igual de bueno."},
{id:"salsarosa",chap:"Para picar",t:"Salsa Rosa",who:"Lorena",time:"5 min",dd:["mayo","tomato","lemon","bottle","d-spoon"],
 ing:["2 cucharadas de mayonesa","1 cucharada de ketchup","1 cucharadita de mostaza","Un chorrito de Moriles (o coñac)","Un chorrito de zumo de naranja"],
 prep:["Mezcla la mayonesa, el ketchup y la mostaza, y remueve bien.","Pruébala. Como queda muy espesa, añade un chorrito de Moriles (o de coñac) y otro de naranja: una cucharadita de café de cada.","¿La quieres más espesa? Más mayonesa, pero siempre el doble que de ketchup.","Con más mostaza queda más ácida y con más color. ¡Y lista!"],
 quote:"El doble de mayonesa que de ketchup… y listo"},
{id:"alioli",chap:"Para picar",t:"Alioli de Membrillo",who:"Raquel",time:"1 h",dd:["d-bottle","oil","salt","d-spoon","d-leaf"],
 ing:["1 cabeza y media de ajos","Membrillo","Aceite de girasol","Sal"],
 prep:["Tritura la cabeza y media de ajos con aceite y sal.","Pela el membrillo y hiérvelo en agua.","Escúrrelo muy bien: tiene que quedar como una pasta, completamente seco.","Junta los ajos con el membrillo y ve añadiendo aceite de girasol, ligándolo como si fuera una mayonesa, hasta que salga una pasta.","Guárdalo en botes. No hace falta nevera: bien tapado aguanta un mes."],
 quote:"Lo dulce y lo fuerte, bien ligados",truco:"Aceite de girasol, para que no quede tan fuerte."},
{id:"empanadillas",chap:"Para picar",t:"Empanadillas de Atún",who:"Rosario",book:"Recetario Pacheco Molina",time:"45 min",dd:["tuna","egg","pepper","tomato","olive"],
 ing:["16 obleas de empanadilla","2 huevos cocidos","1 pimiento asado","1 lata grande de atún","1 cebolla","Tomate frito (4-6 cucharadas)","Olivas (opcional)"],
 prep:["Pica muy, muy pequeñito el huevo cocido, el pimiento asado y el atún escurrido.","Sofríe la cebolla bien picadita, añade el tomate y déjalo chup chup.","Mézclalo todo, echando el tomate que pida: unas 4 o 6 cucharadas grandes.","Si quieres, añade unas olivas muy picaditas.","Rellena las obleas, ciérralas con un tenedor y fríelas hasta que se doren."],
 quote:"Hechas a ojo… y con cariño",truco:"Para Eva, buscar obleas sin gluten: cada vez hay más."},
{id:"bunuelos",chap:"Para picar",t:"Buñuelos de Bacalao",who:"Rosario",book:"Recetario Pacheco Molina",time:"40 min + desalar",dd:["d-leaf","egg","flour","bottle","d-spoon"],
 ing:["¼ kg de bacalao sin espinas","3 ajos","Perejil","2 huevos","½ cerveza 0,0 o agua con gas","Harina (a ojo)","Pimienta y una pizca de orégano","Aceite para freír"],
 prep:["Desala el bacalao en agua y pícalo muy, muy chiquitito con los ajos y el perejil.","Bate los huevos con media cerveza sin alcohol o agua con gas.","Ve añadiendo harina: que no quede ni muy espesa ni muy clara.","Añade el bacalao picado, un poco de pimienta y una chispita de orégano.","Fríe cucharadas de masa en aceite caliente hasta que se doren."],
 quote:"El bacalao, chiquitito, chiquitito"},
{id:"futbol",chap:"Ensaladas",t:"Ensalada de Fútbol",who:"Javi",book:"Recetario Pacheco & Cegarra",time:"30 min",dd:["ball","tuna","olive","egg","bowl"],
 ing:["300 g de arroz","4 latas de atún","Olivas","Tortilla francesa (pág. @tortilla)","Aceite, sal y pimienta"],
 prep:["Cuece el arroz y escúrrelo: se come caliente.","Haz la tortilla francesa y córtala a tiras, sin enrollar.","Mézclalo todo con el atún y las olivas.","Aliña con aceite, sal y pimienta… ¡y a jugar el partido!"],
 quote:"La ensalada que gana todos los partidos"},
{id:"pasta",chap:"Ensaladas",t:"Ensalada de Pasta Templada",who:"Javi",book:"Recetario Pacheco & Cegarra",time:"20 min",dd:["macaroni","tuna","olive","bottle","d-fork"],
 ing:["300 g de macarrones","4 latas de atún","Olivas","Vinagre de Módena","Aceite y sal"],
 prep:["Cuece los macarrones con sal y escúrrelos.","Mézclalos enseguida, aún calientes, con el atún y las olivas: es un plato templado.","Aliña con vinagre de Módena, aceite y sal."],
 quote:"El que espera a que se enfríe, se queda sin pasta"},
{id:"tortilla",chap:"Platos",t:"Tortilla Francesa",who:"Lorena",time:"5 min",dd:["egg","cracked","salt","oil","d-whisk"],
 ing:["1 huevo","Sal","Aceite"],
 prep:["Bate el huevo sin sal hasta que esté espumoso y blanquito, sin llegar a punto de nieve.","Pon el aceite en la sartén y, cuando esté caliente, echa la sal en el aceite.","Echa el huevo encima y extiéndelo muy fino por toda la sartén.","Cuando se dore, dale la vuelta. No se dobla: redonda y plana."],
 quote:"Para hacer una buena tortilla, hay que romper algún huevo"},
{id:"chile",chap:"Platos",t:"Chile con Carne",who:"Eva",time:"1 h 15 min + 1 noche",dd:["chili","pepper","tomato","avocado","onion"],
 ing:["500 g de carne picada","1 cebolla","1 pimiento rojo","2 dientes de ajo","400 g de tomate triturado","1 bote de alubias rojas","Comino, pimentón y orégano","Cayena o chile en polvo","150 ml de caldo","Aceite, sal y pimienta"],
 prep:["Pica la cebolla, el pimiento y el ajo pequeñitos.","Sofríe la cebolla y el pimiento 8 minutos. Añade el ajo 1 minuto más.","Sube el fuego y añade la carne, deshaciéndola hasta que pierda el color rosa.","Añade una cucharadita de cada especia y la cayena, y remueve 1 minuto.","Echa el tomate y el caldo, sal y pimienta. Tapa y a fuego bajo 30-40 minutos.","Añade las alubias escurridas y 10 minutos más. Prueba: ¡tiene que picar!","Déjalo de un día para otro en la nevera: está mucho más bueno.","Sírvelo en fajitas, con nachos o con arroz."],
 quote:"La venganza se sirve fría; el chile, al día siguiente"},
{id:"calabacin",chap:"Platos",t:"Calabacín Relleno de Atún",who:"Eva",time:"45 min",dd:["zucchini","tuna","onion","cheese","d-spoon"],
 ing:["2 calabacines","2 latas de atún","1 cebolla","Queso rallado","Aceite y sal"],
 prep:["Horno a 200 °C. Corta los calabacines a lo largo y vacíalos, dejando 1 cm de borde.","Hornea las barcas 10 minutos con sal y un hilo de aceite.","Sofríe la cebolla, añade la pulpa picada 5 minutos y luego el atún.","Rellena, cubre con queso y gratina 15 minutos hasta que se dore."],
 quote:"Verde por fuera, dorado por arriba"},
{id:"empanada",chap:"Platos",t:"Empanada de Atún y Huevo",who:"Eva",time:"1 h",dd:["tuna","egg","tomato","onion","d-rolling"],
 ing:["Masa sin gluten (Mercadona)","2 latas de atún","3 huevos cocidos","1 bote de tomate frito","1 cebolla (opcional)","1 huevo para pintar"],
 prep:["Cuece los huevos 10 minutos y pélalos.","Sofríe la cebolla, añade el tomate frito y el atún, y deja que el tomate se evapore.","Casi evaporado, añade las claras a trozos y las yemas chafadas: el relleno tiene que quedar seco.","Deja enfriar. Extiende la masa, pon el relleno, tapa y cierra los bordes con un tenedor.","Pinta con huevo, haz un agujerito y al horno como diga el paquete."],
 quote:"Quien con atún se acuesta, con empanada se levanta"},
{id:"pisto",chap:"Platos",t:"Pisto",who:"Raquel",book:"Recetario Pacheco Carnicero",time:"35 min",dd:["zucchini","pepper","onion","potato","d-spoon"],
 ing:["3 patatas","2 pimientos verdes","2 calabacines","1 cebolla","Aceite de oliva","Sal y pimienta"],
 prep:["Pela las patatas y córtalas con la mandolina, vuelve a lavar, escurre y ponlas en el microondas a máxima potencia 5-6 min.","Sartén 1: con una cucharada de aceite pocha la cebolla y, cuando esté, añade la patata hasta que se dore.","Sartén 2: con una cucharada de aceite haz el pimiento a tiras y, cuando esté, añade el calabacín cortado con mandolina. Cocínalo todo junto.","Junta la sartén 1 y la 2, añade sal y pimienta y déjalo a fuego bajo de 5 a 10 min ¡y a disfrutar!"]},
{id:"pollo",chap:"Platos",t:"Pollo Guisado",who:"Raquel",hero:"chile",time:"1 h",dd:["onion","tomato","carrot","bottle","d-leaf"],
 ing:["1 pollo troceado","1 cabeza de ajos","Aceite","1 cebolla","Zanahoria (opcional)","1 bote de tomate","Un poco de vino","1 hoja de laurel","Caldo"],
 prep:["Trocea el pollo y dóralo en la sartén con aceite y la cabeza de ajos, bien tostadito.","Añade la cebolla (y la zanahoria, si quieres) y el tomate.","Un poco de vino y una hoja de laurel: de huerto, que si no, no funciona.","Echa el caldo que veas y déjalo chup chup más de media hora a fuego lento."],
 quote:"A fuego lento, que las prisas no guisan"},
{id:"conejo",chap:"Platos",t:"Conejo al Ajillo",who:"Raquel",hero:"chile",time:"45 min",dd:["d-leaf","oil","bottle","pan","d-fork"],
 ing:["1 conejo troceado","Aceite","1 cabeza de ajos","Perejil","Un poco de orégano","Un chorretón de vinagre","Un poquito de agua"],
 prep:["Trocea el conejo y dóralo bien en la sartén con aceite.","Tritura la cabeza de ajos con perejil y un poco de orégano: ¡chintín, chintín!","Añádelo al conejo con un chorretón de vinagre y muy poquita agua.","Déjalo chup chup a fuego lento hasta que haga su salsa."],
 quote:"Ajo, perejil y paciencia",truco:"Con alitas de pollo sale igual de bueno."},
{id:"alitas",chap:"Platos",t:"Alitas en Escabeche",who:"Raquel",time:"45 min + enfriar",dd:["d-leaf","bottle","oil","salt","d-fork"],
 ing:["Alitas de pollo","Sal y pimienta","Unos ajos","1 hoja de laurel","1 vaso de vinagre","½ vaso de aceite de girasol"],
 prep:["Pon las alitas en la cazuela con sal, pimienta, unos ajos y una hoja de laurel.","Añade el vinagre y el aceite de girasol: la mitad de aceite que de vinagre.","A fuego lento media hora. Nada de prisas.","Déjalas enfriar: el escabeche se queda como una gelatina. Se comen frías."],
 quote:"Todo lo bueno, a fuego lento",truco:"Aceite de girasol: el de oliva queda muy fuerte."},
{id:"canelones",chap:"Platos",t:"Canelones",who:"Toñi",time:"1 h 30 min + 1 noche",dd:["tomato","onion","milk","d-ladle","d-whisk"],
 ing:["250 g de cuello de cerdo","250 g de ibérico","1 cebolla","Tomate triturado","Paté de hígado","Placas de canelones","1 l de leche","2 cucharadas de mantequilla","80 g de harina","Nuez moscada, sal y pimienta"],
 prep:["Que te piquen la carne en la carnicería.","Pocha la cebolla y añade el tomate.","Añade la carne con sal y pimienta. Al final, el paté.","A la nevera de un día para otro.","Cuece la pasta como pone en la etiqueta.","Bechamel, en cazuela: derrite la mantequilla, tuesta la harina y echa la leche poco a poco sin parar de remover. Nuez moscada y sal.","Rellena los canelones.","Bechamel en el fondo de la bandeja, los canelones y el resto de bechamel por encima.","Horno caliente a 170 °C, 20 minutos."],
 quote:"Los canelones de la Toñi no se explican: se repiten"},
{id:"cangrejos",chap:"Platos",t:"Cangrejos del Duero con Tomate",who:"Raquel",book:"Recetario Pacheco Carnicero",time:"40 min + la pesca de José",dd:["tomato","onion","chili","bottle","bread"],
 ing:["1 kg de cangrejos de río","1 cebolla","3 dientes de ajo","1 guindilla","400 g de tomate triturado","1 vaso de vino blanco","Pimentón","Aceite y sal","Pan para mojar"],
 prep:["Que José los pesque en el Duero.","Lávalos bien con agua fría y quítales la tripa tirando de la aleta del centro de la cola.","Sofríe la cebolla, el ajo y la guindilla picados.","Añade los cangrejos a fuego fuerte hasta que se pongan rojos.","Echa el vino, deja que se evapore y añade el tomate y una pizca de pimentón.","Cuece 10-15 minutos, prueba de sal… ¡y a mojar pan!"],
 quote:"Cangrejo que se duerme, se lo lleva José",warn:"La receta es la clásica castellana: confirmar con Raquel cómo los hace ella."},
{id:"cochinillo",chap:"Platos",t:"Cochinillo al Horno",who:"José",time:"unas 2 h 30 min",dd:["potato","bottle","d-leaf","salt","oil"],
 ing:["1 cochinillo","Patatas","Ajo y perejil","Aceite de oliva","Pimienta y pimentón","Trufa picada","½ vaso de vino Moriles","Sal","1 botella de vino, cerveza o Coca-Cola (para ti, mientras se hace)"],
 prep:["Corta las patatas en rodajas de un dedo.","En la bandeja del horno pon unas maderas de enebro (a falta de eso, cucharas de madera) y un vaso de agua.","Pon las patatas encima con pimentón, pimienta y aceite.","Al horno a 170 °C 20 min. Cuando estén doradas, dales la vuelta y 10 min más.","Haz la picada: pica el ajo, el perejil y la trufa; luego añade la pimienta, el aceite y el vino Moriles.","Ábrete tu vino, cerveza o Coca-Cola :)","Unta la carne con la picada y ponla encima de las patatas con la corteza (piel) hacia abajo, con el horno a 180 °C.","Cada 5 min ve untándola con la picada y el jugo de la bandeja por encima.","Cuando esté tierna (ve pinchándola), dale la vuelta: corteza hacia arriba, píntala con aceite y espolvorea sal.","Sácala cuando la corteza esté crujiente, bebe tu trago favorito ¡y sírvela!"],
 quote:"Sin prisa y con vino se hace el cochinillo",
 warn:"Confirmar con José para cuántas personas es y cuánto tiempo tarda en total."},
{id:"rosquillos",chap:"Dulces",t:"Rosquillos",who:"Raquel y Eva",book:"Recetario Pacheco Carnicero",time:"1 h 30 min",dd:["egg","bottle","scissors","flour","sugar"],
 ing:["4 huevos","2 vasitos de aceite frito","1 vasito de anís","1 vasito de leche","4 gaseosillas","1 kg de harina","400 g de azúcar","Aceite para freír"],
 prep:["Monta las claras a punto de nieve.","Añade el azúcar y luego las yemas.","Añade el aceite, la leche y el anís. Sin leche y con 2 vasitos de anís no se ponen duros.","Ve añadiendo la harina con las gaseosillas: entra casi todo el kilo.","Forma los rosquillos con su agujero.","Fríelos en aceite caliente dándoles \"tijeretazos\" alrededor para que queden coronas."],
 quote:"Con tijera y anís, los rosquillos se coronan reyes"},
{id:"zanahoria",chap:"Dulces",t:"Bizcocho de Zanahoria",who:"Toñi",time:"1 h",dd:["carrot","egg","flour","sugar","d-whisk"],
 ing:["250 g de harina","250 g de azúcar","250 g de zanahoria","150 ml de aceite de girasol","3 huevos","15 g de levadura","½ cucharadita de canela","1 pizca de sal"],
 prep:["Horno a 180 °C y engrasa un molde de 22 cm.","Ralla la zanahoria muy fina: así queda jugoso.","Bate los huevos con el azúcar hasta que blanqueen. Añade el aceite y la zanahoria.","Incorpora la harina, la levadura, la canela y la sal tamizadas, con suavidad.","Hornea 40-45 minutos. Si el palillo sale limpio, ¡listo!"],
 quote:"Naranja por fuera… y en el bizcocho nadie me encuentra",warn:"La foto solo traía los ingredientes: los pasos los escribí yo. Comprobar con la Toñi."},
{id:"tiramisu",chap:"Dulces",t:"Tiramisú",who:"Toñi",time:"30 min + 6 h",dd:["cup","egg","sugar","cheese","d-spoon"],
 ing:["3 huevos","3 cucharadas de azúcar","Bizcochos de soletilla","250-300 g de mascarpone","4 tazas de café","Marsala o moscatel","Cacao amargo"],
 prep:["Mezcla las yemas con el azúcar.","Monta las claras a punto de nieve.","Añade a las yemas el queso y las claras, mezclando de abajo arriba para no bajarlas.","Mezcla el café frío con un chorrito de licor y moja los bizcochos rápido.","Capa de bizcochos, capa de crema… y termina con crema.","Nevera mínimo 6 horas. Antes de servir, cacao con un colador."],
 quote:"Tiramisú quiere decir «levántame»… y vaya si lo hace",warn:"El papel de la Toñi acaba en el paso 3: del 4 al 6 son los pasos normales. Comprobar con ella."},
{id:"lechefrita",chap:"Dulces",t:"Leche Frita",who:"Toñi",time:"30 min + 1 día",dd:["milk","lemon","egg","sugar","pan"],
 ing:[{s:"Para la crema"},"1 l de leche entera","7-8 cucharadas de maicena","7-8 cucharadas de azúcar","1 rama de canela","1 tira de piel de limón",{s:"Para rebozar y freír"},"50 g de harina de trigo","2 huevos","300 ml de aceite de oliva suave","30 g de azúcar","1 cucharadita de canela molida"],
 prep:["Infusiona la leche: reserva un vasito y pon el resto en un cazo con la canela, el limón y el azúcar. Calienta hasta que humee, sin hervir, y deja infusionar 10 min.","En el vasito de leche fría, disuelve la maicena hasta que no queden grumos.","Quita la canela y el limón. A fuego medio-bajo, añade la maicena y remueve sin parar con varillas hasta que espese mucho. Cuando empiece a cocer, 2 min más, hasta que haga el «gordo puff».","Échala en una fuente engrasada o con film, de 2 cm de grosor. Deja templar, tapa con film y a la nevera 1 día, hasta que esté muy firme.","Desmolda y corta en cuadrados de unos 5 cm.","Pasa cada trozo primero por harina y luego por huevo batido.","Fríe por tandas en aceite a fuego medio-alto, unos 3 min, hasta que se doren. Escurre en papel.","Mezcla el azúcar con la canela y pasa los trozos aún calientes. ¡Sírvela templada!"],
 quote:"Me hacen con leche y me fríen… ¡y no me derrito!",
 truco:["La crema tiene que quedar bien espesa para poder cortarla.","Fríe a fuego medio-alto: dora rápido sin que se deshaga por dentro.","La maicena se puede cambiar por harina de trigo (necesita algo más de cocción)."]},
{id:"panacota",chap:"Dulces",t:"Panacota",who:"Raquel",time:"30 min + 1 noche",dd:["milk","sugar","d-whisk","d-cup","d-spoon"],
 ing:["½ l de nata de cocinar","Azúcar (a ojo)","Vainilla (esencia o vaina)","1 sobre de gelatina neutra","Caramelo (opcional)","Para servir: mermelada de moras, helado, chocolate o virutas de colores"],
 prep:["Calienta la nata en un cazo.","Añade azúcar a ojo y vainilla, y remueve con varillas hasta que se deshaga el azúcar.","Añade el sobre de gelatina y bate fuerte con varillas unos 10 min, hasta que se deshaga.","Añade bastante vainilla: esencia, o la vaina rasgada.","Ponla en un molde o en vasitos de café (con caramelo abajo, si quieres).","Déjala un cuarto de hora fuera y luego a la nevera hasta el día siguiente.","Sírvela con lo que quieras: mermelada de moras, helado, chocolate… ¡o virutas de colores!"],
 quote:"Un flan de nata… con lo que tú quieras"},
{id:"garrapinadas",chap:"Dulces",t:"Garrapiñadas",who:"Raquel",time:"45 min",dd:["sugar","d-spoon","pan","d-cup","d-leaf"],
 ing:["2 vasos de frutos secos (almendras, avellanas, nueces, cacahuetes…)","½ vaso de agua","1 vaso (o algo menos) de azúcar","Canela, vainilla, ron o café (opcional)"],
 prep:["En una sartén antiadherente caliente, echa los frutos secos y muévelos un poco con una cuchara de madera.","Cuando estén calientes, añade el azúcar. Cuando cruja, ¡chichichichi!, echa el agua.","Remueve hasta que se evapore el agua y el caramelo haga burbujitas. Apaga y espera 5 min.","Otra vez al fuego, sin parar de remover, una media hora, hasta que brillen.","Échalas sobre papel de horno en una bandeja fría.","Cuando estén frías, un golpe, ¡cluc, cluc!, o sepáralas con la mano."],
 quote:"El único secreto: no dejar de remover",truco:"Para hacerlas de sabores, cambia parte del agua por licor, o añade canela o vainilla. (Me lo enseñó la Toñi.)"},
{id:"tartaqueso",chap:"Dulces",t:"Tarta de Queso",who:"Montse",time:"1 h + nevera",dd:["cheese","egg","milk","sugar","d-whisk"],
 ing:["4 huevos","2 tarrinas de Philadelphia (unos 570 g)","1 brik de nata para montar (280 ml)","1 cucharada de harina","Azúcar al gusto (unos 230 g)"],
 prep:["Junta todo en un recipiente hondo y bátelo hasta que quede homogéneo. La harina, hasta que espese.","Mete el dedo y prueba: el azúcar, al gusto de cada uno.","Forra un molde de 18 cm de paredes altas con papel de horno mojado y arrugado, dejando que sobresalga.","Vierte la mezcla y al horno, en la parte baja, a 180-200 °C unos 40 min.","Cuando esté cuajada, apaga el horno y deja que se enfríe dentro.","A la nevera hasta la hora de comerla. Entonces, desmolda y corta."],
 quote:"Unos días sale mejor y otros peor… ¡pero siempre se acaba!",truco:"Montse no mide nada: lo mezcla todo y va probando."},

// rosquillos drawing, built from numbers (crown cuts around the ring)
(function(){const f=n=>n.toFixed(1),R2=Math.PI/180;
 const rq=(cx,cy,s)=>{let o=`<ellipse cx="${f(cx+1)}" cy="${f(cy+5*s)}" rx="${f(17*s)}" ry="${f(7*s)}" fill="url(#k)" stroke="none"/>`;
  o+=`<ellipse cx="${cx}" cy="${cy}" rx="${f(16*s)}" ry="${f(9*s)}" fill="#fff"/>`;
  o+=`<path d="M${f(cx-16*s)} ${cy}A${f(16*s)} ${f(9*s)} 0 0 0 ${f(cx+16*s)} ${cy}A${f(16*s)} ${f(5*s)} 0 0 1 ${f(cx-16*s)} ${cy}Z" fill="url(#k)" stroke="none"/>`;
  const p=(t,k)=>[cx+16*s*k*Math.cos(t*R2),cy+9*s*k*Math.sin(t*R2)];
  for(let a=195;a<=345;a+=15){const[a1,b1]=p(a-4,1),[a2,b2]=p(a+4,1),[a3,b3]=p(a,.76);o+=`<path d="M${f(a1)} ${f(b1)}L${f(a3)} ${f(b3)}L${f(a2)} ${f(b2)}Z" fill="#111" stroke-width=".5"/>`;}
  o+=`<ellipse cx="${cx}" cy="${f(cy-s)}" rx="${f(5*s)}" ry="${f(2.6*s)}" fill="#fff"/>`;
  o+=`<path d="M${f(cx-5*s)} ${f(cy-s)}A${f(5*s)} ${f(2.6*s)} 0 0 1 ${f(cx+5*s)} ${f(cy-s)}A${f(5*s)} ${f(1.3*s)} 0 0 0 ${f(cx-5*s)} ${f(cy-s)}Z" fill="url(#k)" stroke="none"/>`;
  [[-9,-3],[8,-4],[-11,3],[10,2],[-3,5],[4,6],[12,-1]].forEach(([dx,dy])=>o+=`<circle cx="${f(cx+dx*s)}" cy="${f(cy+dy*s)}" r=".5" fill="#111" stroke="none"/>`);
  return o;};
 document.querySelector("defs").insertAdjacentHTML("beforeend",`<symbol id="H-rosquillos" viewBox="0 0 100 100"><g stroke="#111" stroke-width="1.5" stroke-linejoin="round">${rq(28,42,1.3)}${rq(72,40,1.3)}${rq(50,68,1.45)}</g></symbol>`);
})();

const vb=id=>id==="cracked"?"0 0 40 40":"0 0 24 24";
const use=(id,cls="",st="")=>`<svg class="${cls}" ${st?`style="${st}"`:""} viewBox="${vb(id)}" aria-hidden="true"><use href="#${id}"/></svg>`;
const ink=id=>{const el=document.getElementById(id); if(!el) return "";
  return `<svg viewBox="${el.getAttribute("viewBox")}" aria-hidden="true">${el.innerHTML.replace(/<(path|ellipse|circle|rect|line)\b/g,'<$1 vector-effect="non-scaling-stroke"')}</svg>`;};
const ingText=t=>esc(t).replace(/@(\w+)/g,'<span data-ref="$1">00</span>');

// frame, header and corner doodles shared by every page
const chrome=r=>`<div class="fr"></div>
 <div class="hd"><svg viewBox="0 0 24 24" style="transform:scaleX(-1)"><use href="#curl"/></svg>${esc((r.book||"Recetario Pacheco").toUpperCase())}<svg viewBox="0 0 24 24"><use href="#curl"/></svg></div>
 ${use("cornerbug","cn","left:9.6cqw;top:10.2cqw")}${use("cornerbug","cn","right:9.6cqw;top:10.2cqw;transform:scaleX(-1)")}
 ${use("cornerbug","cn","left:9.6cqw;bottom:10.2cqw;transform:scaleY(-1)")}${use("cornerbug","cn","right:9.6cqw;bottom:10.2cqw;transform:scale(-1,-1)")}`;
// cluster of little drawings top-left, like her mojito page
const SLOTS=[[8,6,9,-8],[50,30,11,0],[4,52,10,6],[40,64,8,-10],[70,74,7,12]];
const cluster=r=>r.dd.map((id,i)=>{const[x,y,s,rot]=SLOTS[i];return use(id,"",`left:${x}%;top:${y}%;width:${s}cqw;height:${s}cqw;transform:rotate(${rot}deg)`)}).join("")+
  use("d-heart","","left:42%;top:10%;width:3cqw;height:3cqw")+use("d-heart","","left:84%;top:44%;width:2.6cqw;height:2.6cqw")+use("d-heart","","left:22%;top:88%;width:2.6cqw;height:2.6cqw")+
  use("d-spark","","left:72%;top:8%;width:3.2cqw;height:3.2cqw")+use("d-spark","","left:30%;top:42%;width:2.6cqw;height:2.6cqw")+use("d-spark","","left:90%;top:90%;width:3cqw;height:3cqw");
const tail=(s,x)=>s&&s.length<=10?`<text x="${x}" y="40" text-anchor="middle" font-family="Kalam, cursive" font-size="11" textLength="${Math.min(28,s.length*4.4)}" lengthAdjust="spacingAndGlyphs">${esc(s)}</text>`:"";
const ribbon=r=>{const who=("• "+(r.byline||"de "+r.who)+" •").toUpperCase(), fit=who.length>12?` textLength="128" lengthAdjust="spacingAndGlyphs"`:"";
  const sv=r.serves, under=[sv&&sv.length>10?sv:"",r.time.length>10?r.time:""].filter(Boolean).join(" · ");
  return `<svg class="rb" viewBox="0 0 200 50" aria-hidden="true"><use href="#${sv?"rbn2":"rbn"}"/>
   <text x="${sv?100:89}" y="${sv?21.5:23.5}" text-anchor="middle" font-family="Kalam, cursive" font-size="15"${who.length>12?` textLength="${sv?104:128}" lengthAdjust="spacingAndGlyphs"`:""}>${esc(who)}</text>
   ${tail(sv,29)}${tail(r.time,172)}</svg>${under?`<div class="tm">${esc(under)}</div>`:""}`;};
const stepsHTML=(r,a,b)=>b>a?`<ol class="st" start="${a+1}">${r.prep.slice(a,b).map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`:"";
const quoteHTML=r=>`<div class="endb">${r.quote?`<div class="fq">“${esc(r.quote.toUpperCase())}”${use("d-leaf")}</div>`:""}${r.truco?(Array.isArray(r.truco)?`<div class="tk">✱ <b>TRUCOS:</b>${r.truco.map(x=>`<br>· ${esc(x)}`).join("")}</div>`:`<div class="tk">✱ <b>TRUCO:</b> ${esc(r.truco)}</div>`):""}</div>`;

function firstPage(r,b,end){return `<div class="sheet">${chrome(r)}
  <div class="top"><div class="cl">${cluster(r)}</div><div class="tw"><h3>${esc(r.t)}</h3>${ribbon(r)}</div></div>
  <div class="mid"><div><h4>Ingredientes</h4><ul class="ing">${r.ing.map(x=>typeof x==="object"?`<li class="sub">${esc(x.s)}</li>`:`<li>${ingText(x)}</li>`).join("")}</ul></div><div class="hero">${ink("H-"+(r.hero||r.id))}</div></div>
  ${b>0?`<h4>Preparación</h4>${stepsHTML(r,0,b)}`:""}${end?quoteHTML(r):`<div class="sg">sigue en la hoja siguiente →</div>`}</div>`;}
function coverPage(r){return `<div class="sheet">${chrome(r)}
  <div class="top"><div class="cl">${cluster(r)}</div><div class="tw"><h3>${esc(r.t)}</h3>${ribbon(r)}</div></div>
  <h4>Ingredientes</h4><ul class="ing two">${r.ing.map(x=>typeof x==="object"?`<li class="sub">${esc(x.s)}</li>`:`<li>${ingText(x)}</li>`).join("")}</ul>
  <div class="herobig">${ink("H-"+(r.hero||r.id))}</div>
  <div class="sg">la preparación, en la hoja siguiente →</div></div>`;}
function nextPage(r,a,b,end){return `<div class="sheet">${chrome(r)}
  ${use(r.dd[0],"deco","left:15cqw;bottom:30cqw;width:9cqw;height:9cqw;transform:rotate(-10deg)")}${use(r.dd[1],"deco","right:15cqw;bottom:31cqw;width:8cqw;height:8cqw;transform:rotate(8deg)")}${use("d-spark","deco","left:27cqw;bottom:33cqw;width:3cqw;height:3cqw")}${use("d-heart","deco","right:26cqw;bottom:36cqw;width:3cqw;height:3cqw")}
  <h4 class="h4c">Preparación</h4>${stepsHTML(r,a,b)}${end?quoteHTML(r):`<div class="sg">sigue en la hoja siguiente →</div>`}</div>`;}

const meas=document.getElementById("meas");
const over=html=>{meas.innerHTML=`<div class="pgw">${html}</div>`;const s=meas.querySelector(".sheet");return s.scrollHeight>s.clientHeight+1;};

// 1) calibrate: the biggest text size at which her mojito page still fits
function calibrate(){const m=R.find(r=>r.ref);let lo=2,hi=5;
  for(let i=0;i<16;i++){const mid=(lo+hi)/2;document.documentElement.style.setProperty("--fs",mid);
    if(over(firstPage(m,m.prep.length,true))) hi=mid; else lo=mid;}
  document.documentElement.style.setProperty("--fs",(lo*.995).toFixed(3));}

// 2) paginate: fill each page with as many steps as fit, the quote goes on the last one
function paginate(r){const n=r.prep.length;
  if(!over(firstPage(r,n,true))) return [firstPage(r,n,true)];
  // two sheets: sheet 1 = title, ingredients and the drawing; all the steps on sheet 2.
  // if the steps don't fit on one sheet, they start on sheet 1 under the ingredients instead
  if(over(nextPage(r,0,n,true))){
    const old=paginateOld(r);
    if(!/<ol class="st"/.test(old[0])){ // no steps fit on sheet 1: big drawing there, steps split evenly over two sheets
      for(let m=Math.ceil(n/2);m>0&&m<n;m++){ if(!over(nextPage(r,0,m,false))&&!over(nextPage(r,m,n,true))) return [coverPage(r),nextPage(r,0,m,false),nextPage(r,m,n,true)]; }
    }
    return old;}
  const pages=[coverPage(r)];let a=0;
  while(a<n){let b=n; while(b>a+1&&over(nextPage(r,a,b,b===n))) b--;
    if(b===n&&over(nextPage(r,a,n,true))) b=n-1>a?n-1:n;
    pages.push(nextPage(r,a,b,b===n)); a=b; if(pages.length>6) break;}
  return pages;}
function paginateOld(r){const n=r.prep.length,pages=[];let a=0,first=true;
  while(true){const make=(b,end)=>first?firstPage(r,b,end).replace('<div class="sheet">','<div class="sheet cpt">'):nextPage(r,a,b,end);
    let b=n; while(b>a&&over(make(b,b===n))) b--;
    if(b===n&&!over(make(n,true))){pages.push(make(n,true));break;}
    if(b===a){ if(!first) b=a+1; }
    pages.push(make(b,false)); a=b; first=false;
    if(pages.length>6) break;}
  return pages;}

let done={}; try{done=JSON.parse(localStorage.getItem("libro-done")||"{}")}catch(e){}
function build(){
  calibrate();
  let pg=1;const book=document.getElementById("book");let html="",sum="";
  R.forEach(r=>{r.pages=paginate(r);r.p0=pg;pg+=r.pages.length;});
  R.forEach(r=>{const N=r.pages.length,rng=N>1?`${r.p0}-${r.p0+N-1}`:`${r.p0}`;
    sum+=`<tr><td><a href="#${r.id}">${esc(r.t)}</a></td><td>${esc(r.who)}</td><td class="n"><span class="chip ${N===2?"two":N>=3?"three":""}">${N} ${N>1?"hojas":"hoja"}</span></td><td class="n">${rng}</td></tr>`;
    html+=`<article id="${r.id}" class="${done[r.id]?"is-done":""}"><h2>${esc(r.t)}</h2><div class="pages">${r.pages.map((p,i)=>`<div class="pgw">${p}<div class="pglabel">Página ${r.p0+i}${N>1?` · hoja ${i+1} de ${N}`:""}</div></div>`).join("")}</div>
     <div class="side">${r.warn?`<div class="warn"><b>Falta confirmar:</b> ${esc(r.warn)}</div>`:""}<label class="done"><input type="checkbox" id="done-${r.id}" ${done[r.id]?"checked":""}> Ya copiada al libro</label></div></article>`;});
  book.innerHTML=html; document.getElementById("sum").innerHTML=sum;
  document.querySelectorAll("[data-ref]").forEach(s=>{const t=R.find(r=>r.id===s.dataset.ref);s.textContent=t?t.p0:"?";});
  // index sheet
  let ih=`<div class="sheet idx">${chrome({})}<h3>Índice</h3>`,last="";
  R.forEach(r=>{if(r.chap!==last){ih+=`<div class="chap">${esc(r.chap)}</div>`;last=r.chap;}
    ih+=`<a href="#${r.id}"><span class="t">${esc(r.t)}</span><span class="dots"></span><span>${r.p0}</span></a>`;});
  document.getElementById("idxpages").innerHTML=`<div class="pgw">${ih}</div></div>`;
  meas.innerHTML="";
  // drop any loose doodle that lands on top of text
  document.querySelectorAll("#book .sheet").forEach(s=>{const txt=[...s.querySelectorAll("li,.fq,.tk,h4,.sg")].map(e=>e.getBoundingClientRect());
    s.querySelectorAll(":scope > svg.deco").forEach(d=>{const r=d.getBoundingClientRect();
      if(txt.some(x=>r.left<x.right&&r.right>x.left&&r.top<x.bottom&&r.bottom>x.top)) d.remove();});});
}
build();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(build);
document.getElementById("book").addEventListener("change",e=>{if(!e.target.id.startsWith("done-"))return;const id=e.target.id.slice(5);done[id]=e.target.checked;
  e.target.closest("article").classList.toggle("is-done",e.target.checked);try{localStorage.setItem("libro-done",JSON.stringify(done))}catch(err){}});
</script>
